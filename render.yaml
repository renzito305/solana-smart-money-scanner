services:
  - type: web
    name: solana-smart-money-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: PAPER_STARTING_CASH
        value: "500"
      - key: MIN_LIQUIDITY_USD
        value: "100000"
      - key: SIGNAL_SCORE_THRESHOLD
        value: "65"
      - key: PAPER_POSITION_USD
        value: "25"
      - key: PAPER_MAX_OPEN
        value: "5"
      - key: PAPER_TAKE_PROFIT_PCT
        value: "20"
      - key: PAPER_STOP_LOSS_PCT
        value: "10"
      - key: PAPER_REFRESH_SECONDS
        value: "60"
      - key: PRICE_STALE_SECONDS
        value: "180"
